# Desktop builds for Windows, macOS and Linux.
#
# Tauri cannot cross-compile: each bundle has to be produced on the operating
# system it targets, because it links against that system's webview and
# packaging tools. So this is a matrix of real runners rather than something
# clever on one machine.
#
# Triggered by hand, or by pushing a v* tag when there is something to release.

name: desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple silicon)
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Tauri on Linux links against the system webview and needs its headers.
      # None of this is required on the other two, which ship their own.
      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Rust builds are slow and almost entirely cacheable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      # The campaign is generated, not committed as a build artifact, so the
      # oracle runs on every platform we ship on — if a level stopped being
      # beatable under a different toolchain we would rather find out here.
      - run: npm test

      - name: Build the app
        run: npx tauri build --target ${{ matrix.target }}
        env:
          # dev mode unlocks every level and puts the mechanic tags back, which
          # is the whole mystery handed over. Never in a shipped build.
          VITE_NO_DEV: '1'

      - uses: actions/upload-artifact@v4
        with:
          name: maizes-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
