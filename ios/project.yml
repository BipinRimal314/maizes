# The Xcode project is generated from this file: `cd ios && xcodegen`.
# Maizes.xcodeproj is not committed; this is.
name: Maizes
options:
  bundleIdPrefix: com.bipinrimal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Maizes:
    type: application
    platform: iOS
    sources:
      - path: Maizes
      # the campaign ships from the same file the web build serves
      - path: ../public/levels.json
        buildPhase: resources
    info:
      path: Maizes/Info.plist
      properties:
        CFBundleDisplayName: Journey to Maizy
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bipinrimal.maizes
        PRODUCT_NAME: Maizes
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MaizesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MaizesTests
    dependencies:
      - target: Maizes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Maizes:
    build:
      targets:
        Maizes: all
        MaizesTests: [test]
    test:
      targets:
        - MaizesTests
