[package]
name = "maizes"
version = "0.1.0"
description = "Journey to Maizy"
authors = ["Bipin Rimal"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "maizes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
# `generate_context!` expands into code that needs both of these in scope
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# A maze game is not a place to trade binary size for compile time.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
